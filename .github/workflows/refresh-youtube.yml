name: Refresh YouTube channels

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - channels.json
      - requirements.txt
      - scripts/update_channels.py
      - .github/workflows/refresh-youtube.yml

permissions:
  contents: write

concurrency:
  group: youtube-catalogue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public metadata reader
        run: python -m pip install -r requirements.txt
      - name: Refresh channel titles and links
        run: python scripts/update_channels.py
      - name: Commit updated catalogue
        run: |
          if git diff --quiet -- README.md channels data; then
            echo "Catalogue is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md channels data
          git commit -m "Refresh YouTube channel titles and links"
          git push
